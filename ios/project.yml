# The iPhone app's project, generated by XcodeGen:  xcodegen generate
# (GitHub builds it on every change and publishes the generated project as
# the "miqyas-ios-project" artifact, so nobody needs XcodeGen to open it.)
name: Miqyas
options:
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: ar
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  Miqyas:
    type: application
    platform: iOS
    sources:
      - path: Miqyas
    entitlements:
      path: Miqyas/Miqyas.entitlements
    info:
      path: Miqyas/Info.plist
      properties:
        CFBundleDisplayName: مقياس
        CFBundleName: Miqyas
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MiqyasDomain: $(MIQYAS_DOMAIN)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Brand
          UIImageName: Logo
          UIImageRespectsSafeAreaInsets: true
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: switch
            UIApplicationShortcutItemTitle: تبديل الشركة
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeHome
        NSCameraUsageDescription: لتصوير الفواتير والإيصالات وإرفاقها بالمصروفات والمشاريع.
        NSPhotoLibraryUsageDescription: لإرفاق صور الفواتير ومستندات الموقع من ألبوم الصور.
        NSPhotoLibraryAddUsageDescription: لحفظ الصور والتقارير التي تنزّلها من النظام.
        NSMicrophoneUsageDescription: لتسجيل الرسائل الصوتية في محادثات الفريق.
        NSLocationWhenInUseUsageDescription: لإرفاق موقعك بتقرير الموقع اليومي وتسجيل الحضور.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MIQYAS_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(MIQYAS_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: $(MIQYAS_VERSION)
        CURRENT_PROJECT_VERSION: $(MIQYAS_BUILD)
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
