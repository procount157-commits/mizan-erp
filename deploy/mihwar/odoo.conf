[options]
; The database manager stays switched off. With admin_passwd False there is no
; master password to steal, and with list_db False the screen does not exist.
admin_passwd = False
list_db = False

; One database per client, named after its address: alamana.miqyas.ae opens
; the database "alamana" and nothing else. This is what lets one phone app
; serve every client — the engineer types the code, the address picks the
; books — and a client can never reach another's database by its own address.
dbfilter = ^%d$

db_host = db
db_port = 5432
addons_path = /mnt/custom_addons,/mnt/oca_addons
data_dir = /var/lib/odoo

; ON here, and only here. Odoo sits behind Caddy, so the client address and
; the https scheme arrive in forwarded headers; without this every link Odoo
; builds says http, and every login is logged from Caddy's address.
proxy_mode = True

; Multi-process: a page somebody is waiting on is not queued behind a report
; somebody else is generating.
workers = 3
max_cron_threads = 1
gevent_port = 8072
limit_memory_soft = 1610612736
limit_memory_hard = 2147483648
limit_time_cpu = 600
limit_time_real = 1200

log_level = info
