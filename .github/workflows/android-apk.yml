# Builds the Miqyas Android app on every change under mobile/.
# The server address lives in mobile/twa.properties; the signing key in two
# repository secrets, so every build is signed by the same key and installs
# as an update over the last one.
name: Android APK
on:
  push:
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -z "$KS" ]; then echo "::error::the ANDROID_KEYSTORE_B64 secret is not set"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p mobile :app:assembleRelease --no-daemon
      - name: Signing fingerprint (for the server's assetlinks)
        run: keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep "SHA256:"
      - uses: actions/upload-artifact@v4
        with:
          name: miqyas-apk
          path: mobile/app/build/outputs/apk/release/*.apk
