# Builds the Miqyas phone app (Flutter, app/) on every change under app/.
# Same package name and signing key as the first app (ae.miqyas.app, the
# two repository secrets), and a higher version code, so it installs as an
# update over it.
name: Android APK
on:
  push:
    paths: ["app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Signing key
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -z "$KS" ]; then echo "::error::the ANDROID_KEYSTORE_B64 secret is not set"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          flutter build apk --release --build-name=2.0.${{ github.run_number }}
          flutter build appbundle --release --build-name=2.0.${{ github.run_number }}
      - name: Signing fingerprint
        run: keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep "SHA256:"
      - uses: actions/upload-artifact@v4
        with:
          name: miqyas-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: miqyas-aab-for-google-play
          path: app/build/app/outputs/bundle/release/app-release.aab
