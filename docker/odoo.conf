[options]
; Master password — set to False to disable the DB-manager UI in development.
; In production, replace False with a strong password or a pbkdf2 hash.
admin_passwd = False

; Database credentials.
; db_password is intentionally absent here — it is passed at runtime via
; the --db_password CLI argument in docker-compose.yml, sourced from .env.
db_host = db
db_port = 5432
db_user = odoo

addons_path = /opt/odoo/addons,/mnt/custom_addons,/mnt/oca_addons
data_dir = /var/lib/odoo
proxy_mode = True
log_level = info
