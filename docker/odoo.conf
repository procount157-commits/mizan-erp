[options]
; Master password — set to False to disable the DB-manager UI in development.
; In production, replace False with a strong password or a pbkdf2 hash.
admin_passwd = False

; db_host uses the Compose service name for internal DNS resolution.
; db_user and db_password are intentionally absent — they are passed at
; runtime via CLI arguments in docker-compose.yml, sourced from docker/.env.
db_host = db
db_port = 5432

addons_path = /opt/odoo/addons,/mnt/custom_addons,/mnt/oca_addons
data_dir = /var/lib/odoo

; proxy_mode = True must only be enabled when Odoo is behind a trusted
; reverse proxy (nginx, Caddy, etc.).  Leave False for direct-port development.
proxy_mode = False

list_db = False
log_level = info
